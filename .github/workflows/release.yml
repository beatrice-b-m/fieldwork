name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
  id-token: write
jobs:
  build:
    runs-on: macos-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: '3.11'
      - run: uv sync --locked
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run python -c 'import os, fieldwork, tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v"+v and v == fieldwork.__version__'
      - run: uv run pytest
      - run: uv run python scripts/generate_assets.py
      - name: Verify tagged images and README match the release
        run: git diff --exit-code -- docs/assets README.pypi.md
      - run: uv build
      - name: Smoke-test the installed wheel
        run: uv run --no-project --isolated --with ./dist/*.whl python -I examples/investigation.py
      - run: tar -czf fieldwork-documentation-assets.tar.gz docs/assets
      - name: Attach distributions and generated documentation assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* fieldwork-documentation-assets.tar.gz --clobber
      - name: Publish through PyPI trusted publishing
        run: uv publish --trusted-publishing always
