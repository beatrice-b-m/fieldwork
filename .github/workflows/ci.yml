name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check src tests scripts examples
      - run: uv run ruff format --check src tests scripts examples
      - run: uv build
  assets:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run python scripts/generate_assets.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: docs/assets/
